packages:
  - "apps/*"
  - "packages/*"

catalog:
  # TypeScript 7.0 ships `tsc` but no JS compiler API (it returns in 7.1).
  # So `tsc` comes from 7.0 under @typescript/native, and the name `typescript`
  # is Microsoft's TS 6 API package, for typescript-eslint (which refuses 7.0)
  # and the tests that parse source with ts.createSourceFile. Undo once
  # typescript-eslint and those tests work on the 7.x API.
  typescript: "npm:@typescript/typescript6@6.0.2"
  "@typescript/native": "npm:typescript@7.0.2"
  vitest: 5.1.0
  "@vitest/coverage-v8": 5.1.0
  eslint: 10.15.0
  "@eslint/js": 10.0.1
  typescript-eslint: 8.72.2
  "@types/node": 26.6.6
  electron: 45.3.2
  electron-vite: 6.0.0
  electron-builder: 26.18.0
  react: 19.3.1
  react-dom: 19.3.1
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  react-router-dom: 7.18.5
  vite: 8.3.8
  "@vitejs/plugin-react": 6.3.0
  "@playwright/test": 1.65.1
  playwright: 1.65.1
  better-sqlite3: 13.2.0
  "@types/better-sqlite3": 7.6.13
  drizzle-orm: 0.45.4
  drizzle-kit: 0.31.11
  "@electron/rebuild": 4.2.1
  zod: 4.6.7
  ajv: 8.20.0
  "@modelcontextprotocol/sdk": 1.32.2
  "@anthropic-ai/claude-agent-sdk": 0.3.329
  tailwindcss: 4.3.5
  "@tailwindcss/vite": 4.3.5
  "@tanstack/react-query": 5.107.1
  "lucide-react": 1.73.0
  clsx: 2.1.1
  "tailwind-merge": 3.7.0
  "@dnd-kit/core": 6.3.1
