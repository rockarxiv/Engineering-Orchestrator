name: EO-645 diagnostics (temporary)

on:
  push:
    branches: [rockarxiv/EO-645]

jobs:
  diag:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Time the process-table look, idle
        shell: pwsh
        run: |
          $ps = "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe"
          $q = "Get-CimInstance -Query 'SELECT ProcessId, ParentProcessId, CreationDate FROM Win32_Process' | ForEach-Object { '{0} {1} {2}' -f `$_.ProcessId, `$_.ParentProcessId, `$(if (`$_.CreationDate) { `$_.CreationDate.ToFileTimeUtc() } else { 0 }) }"
          "env PSModulePath: $env:PSModulePath"
          foreach ($i in 1..3) { "powershell exit 0: " + (Measure-Command { & $ps -NoProfile -NonInteractive -Command "exit 0" | Out-Null }).TotalSeconds }
          foreach ($i in 1..3) { "powershell CIM look: " + (Measure-Command { & $ps -NoProfile -NonInteractive -Command $q | Out-Null }).TotalSeconds }
          foreach ($i in 1..3) { "powershell Get-WmiObject: " + (Measure-Command { & $ps -NoProfile -NonInteractive -Command "Get-WmiObject -Query 'SELECT ProcessId, ParentProcessId, CreationDate FROM Win32_Process' | Out-Null" | Out-Null }).TotalSeconds }
          foreach ($i in 1..3) { "powershell Import CimCmdlets only: " + (Measure-Command { & $ps -NoProfile -NonInteractive -Command "Import-Module CimCmdlets" | Out-Null }).TotalSeconds }
          & $ps -NoProfile -NonInteractive -Command $q | Select-Object -First 3
          "count: " + (& $ps -NoProfile -NonInteractive -Command $q | Measure-Object).Count
      - name: Time it from Node, as EO does, 8 at once
        shell: pwsh
        run: |
          @'
          const { execFile } = require("node:child_process");
          const ps = process.env.SystemRoot + "\\System32\\WindowsPowerShell\\v1.0\\powershell.exe";
          const q = "Get-CimInstance -Query 'SELECT ProcessId, ParentProcessId, CreationDate FROM Win32_Process' | ForEach-Object { '{0} {1} {2}' -f $_.ProcessId, $_.ParentProcessId, $(if ($_.CreationDate) { $_.CreationDate.ToFileTimeUtc() } else { 0 }) }";
          const one = (args) => new Promise((r) => { const t = Date.now(); execFile(ps, args, { windowsHide: true, maxBuffer: 1 << 28 }, (e, out, err) => r(`${Date.now() - t} ms ${e ? "ERR " + String(err).slice(0, 300) : out.split("\n").length + " lines"}`)); });
          (async () => {
            for (let i = 0; i < 3; i++) console.log("serial look", await one(["-NoProfile", "-NonInteractive", "-Command", q]));
            console.log("8 at once", await Promise.all(Array.from({ length: 8 }, () => one(["-NoProfile", "-NonInteractive", "-Command", q]))));
            console.log("8 exit-0 at once", await Promise.all(Array.from({ length: 8 }, () => one(["-NoProfile", "-NonInteractive", "-Command", "exit 0"]))));
          })();
          '@ | Set-Content -Path diag.cjs
          node diag.cjs
      - name: Build the workspace packages
        run: pnpm exec turbo run build --filter=@eo/core --filter=@eo/engine --filter=@eo/ui
      - name: The shard-1 failures, alone
        continue-on-error: true
        working-directory: apps/desktop
        run: pnpm exec vitest run src/main/process/processTree.test.ts src/main/mcp/superviseStdioServer.test.ts
      - name: A shard-4 failure, alone
        continue-on-error: true
        working-directory: apps/desktop
        run: pnpm exec vitest run src/main/supervisor/codexBudget.test.ts src/main/providers/codex.test.ts
