name: EO-645 diagnostics (temporary)

on:
  push:
    branches: [rockarxiv/EO-645]

jobs:
  diag:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Which variable a look needs
        env:
          EO_FULL_ENV_FILE: ${{ runner.temp }}\full-env.json
        run: |
          node -e "require('fs').writeFileSync(process.env.EO_FULL_ENV_FILE, JSON.stringify(process.env))"
          pnpm exec turbo run envprobe --filter=@eo/core --output-logs=full
