name: EO-645 diagnostics (temporary)

on:
  push:
    branches: [rockarxiv/EO-645]

jobs:
  diag:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start the sampler
        shell: pwsh
        run: |
          @'
          $ps = "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe"
          $q = "Get-CimInstance -Query 'SELECT ProcessId, ParentProcessId, CreationDate FROM Win32_Process' | ForEach-Object { '{0} {1} {2}' -f `$_.ProcessId, `$_.ParentProcessId, `$(if (`$_.CreationDate) { `$_.CreationDate.ToFileTimeUtc() } else { 0 }) }"
          while ($true) {
            try {
              $t = Measure-Command { $p = Get-CimInstance Win32_Process -Property ProcessId,Name,ParentProcessId }
              $t5 = Measure-Command { & $ps -NoProfile -NonInteractive -Command $q | Out-Null }
              $os = Get-CimInstance Win32_OperatingSystem
              $cpu = (Get-CimInstance Win32_Processor | Measure-Object LoadPercentage -Average).Average
              $top = ($p | Group-Object Name | Sort-Object Count -Descending | Select-Object -First 6 | ForEach-Object { "$($_.Name)=$($_.Count)" }) -join ' '
              Add-Content -Path "$env:RUNNER_TEMP\sampler.log" -Value ("{0:HH:mm:ss} procs={1} look7={2:N1}s look5={3:N1}s free={4:N1}GB commitfree={5:N1}GB cpu={6}% {7}" -f (Get-Date), $p.Count, $t.TotalSeconds, $t5.TotalSeconds, ($os.FreePhysicalMemory/1MB), ($os.FreeVirtualMemory/1MB), $cpu, $top)
            } catch { Add-Content -Path "$env:RUNNER_TEMP\sampler.log" -Value ("{0:HH:mm:ss} error {1}" -f (Get-Date), $_) }
            Start-Sleep 15
          }
          '@ | Set-Content -Path "$env:RUNNER_TEMP\sampler.ps1"
          Start-Process pwsh -ArgumentList '-NoProfile','-File',"$env:RUNNER_TEMP\sampler.ps1" -WindowStyle Hidden
          "CPUs: $([Environment]::ProcessorCount)"
          $mp = Get-MpComputerStatus -ErrorAction SilentlyContinue; "Defender RTP: $($mp.RealTimeProtectionEnabled) AMSI: $($mp.AMServiceEnabled)"
      - name: Desktop suite, slice ${{ matrix.shard }} of 4
        continue-on-error: true
        env:
          EO_LOOK_TRACE: "1"
        run: pnpm exec turbo run test '--filter=@eo/desktop' '--' '--shard=${{ matrix.shard }}/4'
      - name: The sampler's log
        if: always()
        shell: pwsh
        run: |
          Get-Content "$env:RUNNER_TEMP\sampler.log"
          Get-CimInstance Win32_Process | Where-Object Name -eq 'node.exe' | Select-Object -First 40 ProcessId, ParentProcessId, CreationDate, @{n='cmd';e={$_.CommandLine.Substring(0, [Math]::Min(200, $_.CommandLine.Length))}} | Format-Table -AutoSize | Out-String -Width 400
